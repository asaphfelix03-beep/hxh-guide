# Pour tester en local : docker compose up --build  ->  http://localhost:8081
# Compte de démo : demo@guide.local / Demo1234
name: hxh-guide

services:
  app:
    build: .
    image: hxh-guide:local
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Database=guide;Username=guide;Password=guide"
      Seed__Demo: "true"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guide
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d guide"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
